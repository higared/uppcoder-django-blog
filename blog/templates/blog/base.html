<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}我的博客{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2937; background: #f9fafb; line-height: 1.7; }
  a { color: #2563eb; text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { background: #111827; color: #fff; padding: 16px 20px; }
  header a { color: #fff; font-size: 20px; font-weight: bold; }
  header nav { float: right; font-size: 14px; }
  header nav a { color: #d1d5db; margin-left: 16px; font-size: 14px; font-weight: normal; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 20px 48px; }
  footer { text-align: center; color: #9ca3af; font-size: 13px; padding: 24px; border-top: 1px solid #e5e7eb; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 8px; font-size: 20px; }
  .meta { color: #6b7280; font-size: 13px; margin-bottom: 8px; }
  .summary { color: #4b5563; }
  .content p { margin: 0 0 1em; }
  .back { display: inline-block; margin-bottom: 16px; font-size: 14px; }
  .empty { color: #6b7280; text-align: center; padding: 48px 0; }
</style>
</head>
<body>
<header>
  <a href="{% url 'post_list' %}">我的博客</a>
  <nav><a href="{% url 'post_list' %}">首页</a><a href="/admin/">后台管理</a></nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer>用 Django + PostgreSQL 搭建 · 跑在 Uppcoder Spark 免费版上</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}我的博客{% endblock %}</title>
<style>
  /* Clean Blog 风格：简洁、白底、衬线标题、大留白。CSS 全内联，
     不依赖外部 CDN 和静态文件，在 Uppcoder 上也不会 404。 */
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; color: #212529; background: #fff; line-height: 1.7; }
  a { color: #212529; text-decoration: none; }
  a:hover { color: #0085a1; }
  /* 顶部导航 */
  .navbar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; z-index: 2; }
  .navbar a { color: #fff; }
  .brand { font-size: 20px; font-weight: 800; letter-spacing: .5px; }
  .navbar nav a { margin-left: 24px; font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
  .navbar nav a:hover { color: rgba(255,255,255,.8); }
  /* 大图头（Clean Blog 的标志） */
  .masthead { position: relative; padding: 140px 20px 90px; text-align: center; color: #fff; background: linear-gradient(135deg, #2c3e50 0%, #4a6b8a 55%, #0085a1 100%); }
  .masthead h1 { margin: 0 0 10px; font-family: Georgia, "Songti SC", "STSong", serif; font-size: 48px; font-weight: 800; line-height: 1.2; }
  .masthead .subheading { font-size: 20px; font-weight: 300; line-height: 1.4; opacity: .92; max-width: 640px; margin: 0 auto; }
  .masthead .meta { margin-top: 16px; font-family: Georgia, "Songti SC", serif; font-style: italic; font-size: 16px; opacity: .85; }
  main { max-width: 768px; margin: 0 auto; padding: 40px 20px 56px; }
  footer { text-align: center; color: #6c757d; font-size: 13px; padding: 32px 20px 48px; border-top: 1px solid #e9ecef; }
  footer a { color: #6c757d; }
  /* 文章预览 */
  .post-preview { padding: 24px 0; }
  .post-preview h2 { margin: 0 0 6px; font-family: Georgia, "Songti SC", "STSong", serif; font-size: 30px; font-weight: 800; line-height: 1.3; }
  .post-preview .post-subtitle { margin: 0 0 10px; font-size: 17px; font-weight: 300; color: #495057; line-height: 1.5; }
  .post-preview .post-meta { font-family: Georgia, "Songti SC", serif; font-style: italic; color: #6c757d; font-size: 15px; }
  .post-preview a:hover h2 { color: #0085a1; }
  hr { border: 0; border-top: 1px solid #e9ecef; margin: 8px 0; }
  .content { font-size: 18px; line-height: 1.9; }
  .content p { margin: 0 0 1.2em; }
  .back { display: inline-block; margin-bottom: 20px; font-size: 14px; color: #0085a1; }
  .empty { color: #6c757d; text-align: center; padding: 48px 0; }
  .empty a { color: #0085a1; }
  @media (max-width: 600px) {
    .masthead { padding: 110px 16px 70px; }
    .masthead h1 { font-size: 34px; }
    .masthead .subheading { font-size: 17px; }
    .post-preview h2 { font-size: 24px; }
    .content { font-size: 17px; }
  }
</style>
</head>
<body>
<header class="navbar">
  <a class="brand" href="{% url 'post_list' %}">我的博客</a>
  <nav><a href="{% url 'post_list' %}">首页</a><a href="/admin/">后台管理</a></nav>
</header>
<div class="masthead">
  <h1>{% block masthead_title %}我的博客{% endblock %}</h1>
  <div class="subheading">{% block masthead_subtitle %}记录 VPS 折腾、Django 学习和橡胶期货笔记{% endblock %}</div>
  {% block masthead_meta %}{% endblock %}
</div>
<main>
  {% block content %}{% endblock %}
</main>
<footer>用 Django + PostgreSQL 搭建 · 跑在 Uppcoder Spark 免费版上 · Clean Blog 风格</footer>
</body>
</html>
